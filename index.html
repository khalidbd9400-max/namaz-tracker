<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Namaz Tracker</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet"><style>body{font-family:'Hind Siliguri',sans-serif}.tab-active{background:#059669!important;color:white}</style></head><body class="bg-[#0f172a] text-white min-h-screen flex items-center justify-center p-4"><div id="auth-box" class="bg-slate-800 p-8 rounded-2xl w-full max-w-md"><h1 class="text-3xl font-bold text-center text-emerald-400">নামাজ ট্র্যাকার</h1><p class="text-center text-slate-400 mb-6">PRO + হিস্টোরি</p><input id="email" type="email" placeholder="ইমেইল" class="w-full p-3 rounded-lg bg-slate-700 mb-3 outline-none"><input id="password" type="password" placeholder="পাসওয়ার্ড" class="w-full p-3 rounded-lg bg-slate-700 mb-4 outline-none"><button onclick="handleAuth()" class="w-full bg-emerald-600 p-3 rounded-lg font-bold">লগইন / নতুন একাউন্ট</button><p id="auth-msg" class="text-center mt-3 text-sm text-amber-300"></p></div><div id="app-box" class="hidden bg-slate-800 p-5 rounded-2xl w-full max-w-md"><div class="flex justify-between items-center mb-4"><div><h2 class="font-bold">আসসালামু আলাইকুম!</h2><p id="user-email" class="text-xs text-slate-400"></p></div><button onclick="logout()" class="text-sm bg-red-600 px-3 py-1.5 rounded-lg">লগআউট</button></div><div class="flex gap-2 mb-4"><button id="tab-today" onclick="showTab('today')" class="flex-1 p-2.5 rounded-xl bg-slate-700 font-bold tab-active">আজকের</button><button id="tab-history" onclick="showTab('history')" class="flex-1 p-2.5 rounded-xl bg-slate-700 font-bold">হিস্টোরি</button></div><div id="today-panel"><p class="text-sm text-slate-300 mb-3">আজ: <span id="today-date"></span></p><div id="namaz-list" class="space-y-3"></div><div class="mt-4 bg-slate-900 p-4 rounded-xl text-center border border-slate-700"><p class="text-slate-400 text-sm">আজকের অগ্রগতি</p><p id="progress" class="text-3xl font-bold text-emerald-400">0/5</p></div></div><div id="history-panel" class="hidden"><h3 class="font-bold mb-3">গত ৩০ দিনের হিস্টোরি</h3><div id="history-list" class="space-y-2 max-h-[350px] overflow-auto"></div></div></div><script>const firebaseConfig={apiKey:"AIzaSyAbDBnt-tvTh8D5ym-svqpW5lhIhiHIl8U",authDomain:"namaz-traker-b1604.firebaseapp.com",projectId:"namaz-traker-b1604",storageBucket:"namaz-traker-b1604.firebasestorage.app",messagingSenderId:"216115508181",appId:"1:216115508181:web:4c238090d4b30bf56d035c"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const db=firebase.firestore();const namazNames=["ফজর","যোহর","আসর","মাগরিব","এশা"];const todayStr=new Date().toISOString().split('T')[0];document.getElementById('today-date').innerText=new Date().toLocaleDateString('bn-BD',{weekday:'long',year:'numeric',month:'long',day:'numeric'});function showTab(t){document.getElementById('today-panel').classList.toggle('hidden',t!=='today');document.getElementById('history-panel').classList.toggle('hidden',t!=='history');document.getElementById('tab-today').classList.toggle('tab-active',t==='today');document.getElementById('tab-history').classList.toggle('tab-active',t==='history');if(t==='history')loadHistory();}function handleAuth(){const e=document.getElementById('email').value.trim();const p=document.getElementById('password').value;const m=document.getElementById('auth-msg');if(!e||p.length<6){m.innerText="সঠিক ইমেইল ও ৬ অক্ষরের পাসওয়ার্ড দিন";return;}m.innerText="অপেক্ষা করুন...";auth.signInWithEmailAndPassword(e,p).catch(()=>auth.createUserWithEmailAndPassword(e,p)).catch(er=>m.innerText=er.message);}function logout(){auth.signOut();}auth.onAuthStateChanged(u=>{if(u){document.getElementById('auth-box').classList.add('hidden');document.getElementById('app-box').classList.remove('hidden');document.getElementById('user-email').innerText=u.email;loadNamaz(u.uid);}else{document.getElementById('auth-box').classList.remove('hidden');document.getElementById('app-box').classList.add('hidden');}});function loadNamaz(uid){db.collection("users").doc(uid).collection("tracker").doc(todayStr).onSnapshot(d=>{const data=d.data()||{};let c=0;const l=document.getElementById('namaz-list');l.innerHTML="";namazNames.forEach(n=>{const done=data[n]||false;if(done)c++;l.innerHTML+=`<label class="flex justify-between items-center bg-slate-700 p-3.5 rounded-xl cursor-pointer"><span class="font-semibold">${n}</span><input type="checkbox" ${done?'checked':''} onchange="toggleNamaz('${n}',this.checked)" class="w-6 h-6 accent-emerald-500"></label>`;});document.getElementById('progress').innerText=`${c}/5`;});}function toggleNamaz(n,c){db.collection("users").doc(auth.currentUser.uid).collection("tracker").doc(todayStr).set({[n]:c},{merge:true});}function loadHistory(){const uid=auth.currentUser.uid;const list=document.getElementById('history-list');list.innerHTML="লোড হচ্ছে...";db.collection("users").doc(uid).collection("tracker").get().then(snap=>{list.innerHTML="";if(snap.empty){list.innerHTML="<p class='text-slate-400 text-center py-4'>এখনো কোনো হিস্টোরি নেই</p>";return;}let docs=[];snap.forEach(doc=>docs.push({id:doc.id,data:doc.data()}));docs.sort((a,b)=>b.id.localeCompare(a.id));docs.forEach(item=>{let cnt=0;namazNames.forEach(n=>{if(item.data[n])cnt++;});const color=cnt==5?"text-emerald-400":cnt>=3?"text-yellow-400":"text-red-400";const msg=cnt==5?'মাশাআল্লাহ':cnt>=3?'ভালো':cnt>0?'চেষ্টা করুন':'মিস';list.innerHTML+=`<div class="flex justify-between items-center bg-slate-700 p-3 rounded-xl"><span class="text-sm">${item.id}</span><span class="font-bold ${color}">${cnt}/5 ${msg}</span></div>`;});}).catch(e=>{list.innerHTML=`<p class='text-red-400 text-sm'>Error: ${e.message}<br>Rules Publish করো</p>`;});}</script></body></html>
